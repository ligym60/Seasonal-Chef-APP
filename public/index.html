<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seasonal Chef</title>
</head>
<body>
  <h1>Roasted Squash Soup</h1>
  <ul>
    <li>1 each butternut squash</li>
    <li>1 each yellow onion</li>
    <li>4 cup vegetable broth</li>
  </ul>
  <button id="get-ingredients">Get ingredients on Instacart</button>
  <p id="status" role="status"></p>

  <script>
    const recipe = {
      title: 'Roasted Squash Soup',
      servings: 4,
      instructions: ['Roast the squash.', 'Simmer with onion and broth.', 'Blend.'],
      ingredients: [
        { name: 'butternut squash', quantity: 1, unit: 'each' },
        { name: 'yellow onion', quantity: 1, unit: 'each' },
        { name: 'vegetable broth', quantity: 4, unit: 'cup' },
      ],
    };
    // Demo only: a real app's backend holds the token and calls this service.
    let token = sessionStorage.getItem('apiToken') || prompt('API token (APP_API_TOKEN)');
    if (token) sessionStorage.setItem('apiToken', token);
    const btn = document.getElementById('get-ingredients');
    const status = document.getElementById('status');
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'Building your Instacart page...';
      try {
        const res = await fetch('/api/instacart/recipe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(recipe),
        });
        const data = await res.json();
        if (!res.ok || !data.url) throw new Error(data.error || 'Request failed');
        window.location.href = data.url;
      } catch (e) {
        status.textContent = 'Sorry, could not reach Instacart: ' + e.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
